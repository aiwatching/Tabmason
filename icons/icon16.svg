<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-aligned 16px variant of icon.svg: same three bricks, no baseline, wider gaps. -->
  <rect width="16" height="16" rx="3.5" fill="#2f7562" shape-rendering="geometricPrecision"/>
  <rect x="5" y="3" width="6" height="4" fill="#8ab4f8"/>
  <rect x="2" y="8" width="5" height="5" fill="#ffffff"/>
  <rect x="9" y="8" width="5" height="5" fill="#fdd663"/>
</svg>
