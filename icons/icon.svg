<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Tabmason: three browser tabs stacked like bricks. Source for icons/*.png (see scripts/render-icons.mjs). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8a73"/>
      <stop offset="1" stop-color="#235747"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- top tab -->
  <path d="M29 47 V30 Q29 22 37 22 H59 Q67 22 67 30 V47 Z" fill="#8ab4f8"/>
  <!-- bottom tabs -->
  <path d="M11 76 V58 Q11 51 18 51 H40 Q47 51 47 58 V76 Z" fill="#ffffff"/>
  <path d="M49 76 V58 Q49 51 56 51 H78 Q85 51 85 58 V76 Z" fill="#fdd663"/>
  <!-- tab strip baseline -->
  <rect x="11" y="79" width="74" height="5" rx="2.5" fill="#ffffff" opacity=".55"/>
</svg>
