<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabmason</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../../icons/icon48.png" alt="" width="28" height="28">
      <div>
        <div class="brand-name">Tabmason</div>
        <div class="brand-tag" data-i18n="appTagline"></div>
      </div>
    </div>
    <label class="lang">
      <span data-i18n="lang"></span>
      <select id="lang" class="select">
        <option value="auto" data-i18n="langAuto"></option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </label>
  </header>

  <main>
    <!-- Groups -->
    <section class="card">
      <div class="card-head">
        <span class="step">1</span>
        <div>
          <h2 data-i18n="secGroups"></h2>
          <p class="sub" data-i18n="secGroupsSub"></p>
        </div>
      </div>

      <div class="plan">
        <label for="planText" class="label" data-i18n="planLabel"></label>
        <p class="hint" data-i18n="planHint"></p>
        <textarea id="planText" class="textarea" rows="5" data-i18n-ph="planPh"></textarea>
        <div class="row">
          <button id="plan" class="btn btn-primary" data-i18n="plan"></button>
          <button id="import" class="btn" data-i18n="importGroups"></button>
          <span id="planStatus" class="status" role="status"></span>
        </div>
      </div>

      <div id="groups" class="groups"></div>
      <p id="groupsEmpty" class="empty" data-i18n="noGroupsYet" hidden></p>

      <div class="card-foot">
        <button id="addGroup" class="btn btn-ghost">+ <span data-i18n="addGroup"></span></button>
        <span class="spacer"></span>
        <span id="groupsStatus" class="status" role="status"></span>
        <button id="saveGroups" class="btn btn-primary" data-i18n="saveGroups"></button>
      </div>
    </section>

    <!-- AI -->
    <section class="card">
      <div class="card-head">
        <span class="step">2</span>
        <div>
          <h2 data-i18n="secAI"></h2>
          <p class="sub" data-i18n="secAISub"></p>
        </div>
      </div>
      <div class="form">
        <label for="provider" data-i18n="provider"></label>
        <select id="provider" class="select">
          <option value="deepseek">DeepSeek</option>
          <option value="glm" data-i18n="glm"></option>
          <option value="openai">OpenAI</option>
          <option value="custom" data-i18n="custom"></option>
        </select>
        <label for="baseURL" data-i18n="baseURL"></label>
        <input id="baseURL" class="input mono" spellcheck="false">
        <label for="model" data-i18n="model"></label>
        <input id="model" class="input mono" spellcheck="false">
        <label for="apiKey" data-i18n="apiKey"></label>
        <input id="apiKey" class="input mono" type="password" spellcheck="false" autocomplete="off">
        <label for="threshold" data-i18n="threshold"></label>
        <div>
          <div class="range">
            <input id="threshold" type="range" min="0.3" max="0.95" step="0.05">
            <output id="thresholdOut"></output>
          </div>
          <p class="hint" data-i18n="thresholdHint"></p>
        </div>
        <label for="neverSend" data-i18n="neverSend"></label>
        <textarea id="neverSend" class="textarea mono" rows="3" spellcheck="false" data-i18n-ph="neverSendPh"></textarea>
      </div>
      <p class="note" data-i18n="privacy"></p>
      <div class="card-foot">
        <button id="testAI" class="btn" data-i18n="test"></button>
        <span class="spacer"></span>
        <span id="aiStatus" class="status" role="status"></span>
        <button id="saveAI" class="btn btn-primary" data-i18n="save"></button>
      </div>
    </section>

    <!-- Behavior -->
    <section class="card">
      <div class="card-head">
        <span class="step">3</span>
        <div><h2 data-i18n="secBehavior"></h2></div>
      </div>
      <label class="toggle-row">
        <div>
          <div class="toggle-title" data-i18n="enabledLabel"></div>
          <div class="hint" data-i18n="enabledHint"></div>
        </div>
        <span class="switch"><input type="checkbox" id="enabled"><span></span></span>
      </label>
      <label class="toggle-row">
        <div>
          <div class="toggle-title" data-i18n="regroupLabel"></div>
          <div class="hint" data-i18n="regroupHint"></div>
        </div>
        <span class="switch"><input type="checkbox" id="regroupOnRefresh"><span></span></span>
      </label>
      <label class="toggle-row">
        <div>
          <div class="toggle-title" data-i18n="titlePrefixLabel"></div>
          <div class="hint" data-i18n="titlePrefixHint"></div>
        </div>
        <span class="switch"><input type="checkbox" id="markTitlePrefix"><span></span></span>
      </label>
      <label class="toggle-row">
        <div>
          <div class="toggle-title" data-i18n="noteInTitleLabel"></div>
          <div class="hint" data-i18n="noteInTitleHint"></div>
        </div>
        <span class="switch"><input type="checkbox" id="markNoteInTitle"><span></span></span>
      </label>
    </section>

    <!-- Usage -->
    <section class="card">
      <div class="card-head">
        <span class="step">4</span>
        <div>
          <h2 data-i18n="secUsage"></h2>
          <p class="sub" data-i18n="secUsageSub"></p>
        </div>
      </div>
      <div id="usageStats" class="stats"></div>
      <table id="usageTable" class="usage-table"></table>
      <p id="usageEmpty" class="empty" data-i18n="usageEmpty" hidden></p>
    </section>

    <!-- Learned -->
    <section class="card">
      <div class="card-head">
        <span class="step">5</span>
        <div>
          <h2 data-i18n="secLearned"></h2>
          <p class="sub" data-i18n="secLearnedSub"></p>
        </div>
      </div>
      <ul id="learned" class="learned"></ul>
      <p id="learnedEmpty" class="empty" data-i18n="learnedEmpty" hidden></p>
      <div class="card-foot">
        <button id="clearCache" class="btn btn-ghost" data-i18n="clearCache"></button>
        <span class="spacer"></span>
        <span id="cacheStatus" class="status" role="status"></span>
      </div>
    </section>
  </main>

  <template id="groupTpl">
    <div class="group">
      <div class="group-head">
        <input class="name input" data-i18n-ph="groupName">
        <div class="colors" role="radiogroup"></div>
        <button class="remove btn btn-ghost btn-sm btn-danger" data-i18n="remove"></button>
      </div>
      <div class="group-meta">
        <span class="pill preview"></span>
        <span class="link-state"></span>
      </div>
      <textarea class="description textarea" rows="2" data-i18n-ph="groupDesc"></textarea>
      <details class="rules-box">
        <summary><span data-i18n="groupRules"></span> <span class="rules-count"></span></summary>
        <textarea class="rules textarea mono" rows="3" spellcheck="false" data-i18n-ph="rulesPh"></textarea>
        <p class="hint" data-i18n="rulesHint"></p>
      </details>
    </div>
  </template>

  <script src="options.js" type="module"></script>
</body>
</html>
